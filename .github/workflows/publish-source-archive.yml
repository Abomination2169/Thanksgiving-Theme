name: Publish Thanksgiving source archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source archive
        run: zip -r Thanksgiving-Theme-GitHub-Source.zip README.md Source

      - name: Attach source archive to v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 Thanksgiving-Theme-GitHub-Source.zip --clobber --repo "${GITHUB_REPOSITORY}"
